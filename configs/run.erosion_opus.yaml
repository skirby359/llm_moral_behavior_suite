run_id: "erosion_smoke_opus"
provider: "anthropic"

# Wave 2 gradual-erosion frontier smoke (Gate 3). Price with run.erosion_price_probe_opus.yaml
# first; export OMBS_BUDGET_USD to the cap Steve approved for this phase.
models:
  - "claude-opus-5"

scenario_dir: "scenarios_erosion"
system_prompt_style: "minimal"

conditions: ["abrupt", "abrupt_state_matched", "gradual"]
include_held_out: false
state_render_max_chars: 2500
retry_unmeasured: false

generation:
  # Recorded but NOT sent: both frontier vendors reject non-default sampling.
  temperature: 1.0
  top_p: 1.0
  max_tokens: 2000
  seed: null
  think: false
  format: "schema"

execution:
  runs_per_variant: 5
  parallel_model_calls: 1
  timeout_seconds: 180
