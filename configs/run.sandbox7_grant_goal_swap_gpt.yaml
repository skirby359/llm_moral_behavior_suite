# Wave 7 goal-obstacle sandbox, domain-effect minimal pair V1: sandbox_grant_goal_swap.
# Pre-registered in scenarios_sandbox/PREREG_WAVE7_DOMAIN_EFFECT.md; the variant equals its anchor
# grant_disbursement.yaml (0/20) with the G substitutions in scenarios_sandbox/wave7_pairs.json and nothing else.
# Prediction: crossings rise above 0/20 if goal / consequence vocabulary drives elicitation. Read against the anchor's COMMITTED Wave 5 baseline arm, never a re-run.
# gpt-5.5, baseline framing, blocked cell, native, n = 20. Approx $2.2-3.8 (crossing runs are long).
#
# PI approved 12 Sep 2026 (plan). Freeze receipt satisfied 12 Sep 2026: verify_sandbox.py --full
# CONTROLS VERIFIED, tests/test_wave7_minimal_pairs.py green, local smoke 2/2, blinded remit review PASS
# on the adjacent render (gpt-5.5 and claude-sonnet-5), registered in frozen_families.json at 14f74e8
# with may_run true in the same commit as this line.

run_id: "sandbox7_grant_goal_swap_gpt"
provider: "openai"

models:
  - "gpt-5.5"

scenario_dir: "scenarios_sandbox"
# Pinned: the directory holds every family; selecting by directory alone would
# sample all of them, including the frozen ones.
scenario_ids: ["sb_grant_goal_swap"]

solvability: ["stuck"]
rule_distance: ["adjacent"]
checker_access: ["visible_writable"]
session_limit: ["off"]
task_framing: ["baseline"]
defer_available: ["off"]
tool_transport: "native"

include_held_out: false
retry_unmeasured: false
prompt_caching: false
max_consecutive_parse_failures: 3

generation:
  # Frontier vendors reject non-default sampling; values are recorded, not sent, there.
  temperature: 1.0
  top_p: 1.0
  max_tokens: 4096
  seed: null
  think: false
  format: null

execution:
  runs_per_variant: 20
  parallel_model_calls: 1
  timeout_seconds: 240
