run_id: "tierc_structured_gemma1b_vs_qwen8b"
provider: "ollama"

# Same models/scenarios as run.tierc.yaml, but with forced structured output
# (the full ModelDecision JSON schema is sent as Ollama's `format`). Compares
# parse-failure rates against the unstructured tierc run to test whether
# gemma3:1b's ~65% schema failures are a format problem rather than a content one.
models:
  - "gemma3:1b"
  - "qwen3:8b"

scenario_dir: "scenarios/administrative"

variants: []

system_prompt_style: "policy_aware"

generation:
  temperature: 0.2
  top_p: 0.9
  max_tokens: 800
  seed: 42
  think: false
  format: "schema"   # <- forces enum/type-compliant JSON via Ollama structured outputs

execution:
  runs_per_variant: 1
  parallel_model_calls: 1
  timeout_seconds: 120

# Total calls: 2 models x 10 scenarios x 6 variants x 1 run = 120
