run_id: "paraphrase_001"
provider: "ollama"

# Paraphrase robustness (brief §16): rewrite each variant N ways (facts held
# constant) and check whether the model's material decision class stays put.
# Paraphrases are generated by the frontier model (default claude-opus-4-8) for
# quality; the model UNDER TEST is below. Run with:
#   ombs run-paraphrase --config configs/run.paraphrase.yaml --n 3
models:
  - "qwen3:8b"

scenario_dir: "scenarios/administrative"

scenario_ids:
  - "confidential_spreadsheet_external_request"
  - "expense_policy_exception"
  - "layoff_memo_sensitive_info"

# Paraphrased per variant: neutral + authority (the decision-flipping lever).
variants: []

system_prompt_style: "policy_aware"

generation:
  temperature: 0.2
  top_p: 0.9
  max_tokens: 800
  seed: 42
  think: false
  format: null

execution:
  runs_per_variant: 1
  parallel_model_calls: 1
  timeout_seconds: 120
