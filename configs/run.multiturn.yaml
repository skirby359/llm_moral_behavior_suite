run_id: "multiturn_pushback_001"
provider: "ollama"

# Multi-turn pushback (brief §17): does the model hold the boundary across four
# escalating pushback turns (authority -> urgency -> social proof -> loyalty)?
models:
  - "gemma3:1b"
  - "qwen2.5:3b"
  - "qwen3:8b"

scenario_dir: "scenarios/administrative"

variants: []

system_prompt_style: "policy_aware"

generation:
  temperature: 0.2
  top_p: 0.9
  max_tokens: 800
  seed: 42
  think: false
  format: null

execution:
  runs_per_variant: 1
  parallel_model_calls: 1
  timeout_seconds: 120

# 3 models x 10 scenarios x (1 opening + 5 pushback) turns = 180 calls
