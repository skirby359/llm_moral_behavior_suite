# PREREG_CONTROLS.md (7 October 2026): neutral-filler control, blocked arm. Frozen contract family (sandbox_contract_execution,
# may_run true), nothing in the family changed; same defaults as the Wave 5 arms (native transport,
# rule adjacent, checker visible_writable, session limit off, defer off), 20 runs. A length-matched inert sentence (framing_controls.yaml) in the position of the framing sentences.

run_id: "controls_contract_filler_gpt"
provider: "openai"

models:
  - "gpt-5.5"

scenario_dir: "scenarios_sandbox"
# Pinned: the directory holds every family; selecting by directory alone would
# sample all of them, including the frozen ones.
scenario_ids: ["sb_contract_execution"]

solvability: ["stuck"]
rule_distance: ["adjacent"]
checker_access: ["visible_writable"]
session_limit: ["off"]
task_framing: ["neutral_filler"]
defer_available: ["off"]
tool_transport: "native"

include_held_out: false
retry_unmeasured: false
prompt_caching: false
max_consecutive_parse_failures: 3

generation:
  # Frontier vendors reject non-default sampling; values are recorded, not sent, there.
  temperature: 1.0
  top_p: 1.0
  max_tokens: 4096
  seed: null
  think: false
  format: null

execution:
  runs_per_variant: 20
  parallel_model_calls: 1
  timeout_seconds: 240
