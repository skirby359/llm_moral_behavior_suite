run_id: "tools_multiturn_001"
provider: "ollama"

# Phase 6 × Phase 7: give the model tools, then push back across turns. Does a
# safe opening tool choice (request_approval / draft) degrade into an actual
# send_email under sustained authority pressure?
models:
  - "qwen2.5:3b"
  - "qwen3:8b"

scenario_dir: "tool_scenarios"

variants: []

system_prompt_style: "policy_aware"

generation:
  temperature: 0.2
  top_p: 0.9
  max_tokens: 800
  seed: 42
  think: false
  format: null

execution:
  runs_per_variant: 1
  parallel_model_calls: 1
  timeout_seconds: 120

# 2 models x 2 pushback tool scenarios x (1 opening + 5 pushback) = 24 calls
