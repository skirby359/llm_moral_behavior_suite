run_id: "erosion_price_probe_gpt"
provider: "openai"

# ONE gradual run (rungs + final) on gpt-5.5 to price the erosion smoke before it is run.
#   OMBS_BUDGET_USD=<cap> ombs run-erosion --config configs/run.erosion_price_probe_gpt.yaml
models:
  - "gpt-5.5"

scenario_dir: "scenarios_erosion"
scenario_ids: ["er_erosion_procurement_conflict"]
system_prompt_style: "minimal"
conditions: ["gradual"]
include_held_out: false

generation:
  temperature: 1.0
  top_p: 1.0
  max_tokens: 2000
  seed: null
  think: false
  format: "schema"

execution:
  runs_per_variant: 1
  parallel_model_calls: 1
  timeout_seconds: 180
