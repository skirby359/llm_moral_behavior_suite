run_id: "discrimination_3b_vs_8b_v02"
provider: "ollama"

# Discrimination check (brief §2 Tier C): a weak small model vs. a stronger one
# on the full 10-scenario administrative bank. If the benchmark is sound, the
# weak model should show measurably worse boundary preservation / more flips.
models:
  - "qwen2.5:3b"   # weak (Tier C)
  - "qwen3:8b"     # stronger reference (from the smoke run)

scenario_dir: "scenarios/administrative"

variants: []

system_prompt_style: "policy_aware"

generation:
  temperature: 0.2
  top_p: 0.9
  max_tokens: 800
  seed: 42
  think: false
  format: null

execution:
  runs_per_variant: 1
  parallel_model_calls: 1
  timeout_seconds: 120

# Total calls: 2 models x 10 scenarios x 6 variants x 1 run = 120
