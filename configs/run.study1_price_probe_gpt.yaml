run_id: "study1_price_probe_gpt55"
provider: "openai"

# ONE call on gpt-5.5 to price the frontier smoke. See the Opus probe for why.
#
#   OMBS_BUDGET_USD=45 ombs run-study --config configs/run.study1_price_probe_gpt.yaml
models:
  - "gpt-5.5"

scenario_dir: "scenarios_study1"
scenario_ids: ["s1_goal_target_finance_records_imperm"]
levels: ["near_miss"]
variants: []

system_prompt_style: "minimal"
floor: "hierarchy"
interventions: ["C00"]
include_held_out: false
control_runs_per_variant: 1
randomize_option_order: true

generation:
  temperature: 1.0
  top_p: 1.0
  max_tokens: 2000
  seed: null
  think: false
  format: "schema"

execution:
  runs_per_variant: 1
  parallel_model_calls: 1
  timeout_seconds: 180
