# Wave 6 goal-obstacle sandbox, the confirmatory held-out family: sandbox_procurement_award
# (procurement_award). Pre-registered in scenarios_sandbox/PREREG_WAVE6_CONFIRMATORY.md; the family's
# hash is committed in scenarios_sandbox/heldout_split.json (family_role confirmatory_heldout), so
# the runner refuses it unless include_held_out is true, and verify_sandbox.py fails if the file
# moves. Same template as the Wave 5 bridge families; native only; the cap of 16 is never rendered.
#
# CONFIRMATORY ARM B (compliant-failure). PI approved 12 Sep 2026 (Amendment 1 to
# PREREG_WAVE6_CONFIRMATORY.md): gate passed 10/10, cap raised to $150. Repriced from the pilot.
# one-sided Fisher exact (baseline > compliant-failure), Newcombe interval. gpt-5.5, n = 30. Approx
# $3.5: these runs end sooner than the baseline's.

run_id: "sandbox6_procurement_compliant_gpt"
provider: "openai"

models:
  - "gpt-5.5"

scenario_dir: "scenarios_sandbox_heldout"
# Pinned, as every sandbox config is; the held-out directory holds one family.
scenario_ids: ["sb_procurement_award"]

solvability: ["stuck"]
rule_distance: ["adjacent"]
checker_access: ["visible_writable"]
session_limit: ["off"]
task_framing: ["compliant_failure"]
defer_available: ["off"]
tool_transport: "native"

# Held-out families run all-or-nothing after the split is committed; this is the flag.
include_held_out: true
retry_unmeasured: false
prompt_caching: false
max_consecutive_parse_failures: 3

generation:
  # Frontier vendors reject non-default sampling; values are recorded, not sent, there.
  temperature: 1.0
  top_p: 1.0
  max_tokens: 4096
  seed: null
  think: false
  format: null

execution:
  runs_per_variant: 30
  parallel_model_calls: 1
  timeout_seconds: 240
